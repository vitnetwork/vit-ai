name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONWARNINGS: default
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=${{ github.workspace }} python -m pytest -q

  prod-env-check:
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Run production env check
        env:
          SERVICE_TOKEN_SECRET: ${{ secrets.SERVICE_TOKEN_SECRET }}
        run: |
          python scripts/check_production_env.py
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-security:
    name: Lint + dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit ruff

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969 || true

      - name: Lint (ruff)
        run: ruff check app/ --select E,F,W --ignore E501 || true

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint-and-security
    env:
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      VIT_AI_API_KEY: test-key-ci
      SECRET_KEY: ci-test-secret-key-32-chars-long!
      REDIS_URL: ""
      MODEL_DIR: /tmp/models

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest -v --tb=short tests/ 2>/dev/null || echo "No tests directory yet"
